server {
    listen 80;
    server_name localhost slimflix.lat www.slimflix.lat;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # /api/spacetg.shop/player_api.php → http://spacetg.shop/player_api.php
    location ~ ^/api/(?<iptv_host>[^/]+)(?<iptv_uri>/.*)?$ {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;

        set $upstream_path $iptv_uri;
        if ($upstream_path = "") {
            set $upstream_path /;
        }

        proxy_pass http://$iptv_host$upstream_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $iptv_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain";
            return 204;
        }
    }
}
