server {
    listen 80;
    server_name localhost;

    # Serve os arquivos estáticos do seu Webplayer (HTML/CSS/JS)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # O Proxy que vai buscar as listas em HTTP puro no seu servidor
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        
        # IP da sua VPS Contabo e a porta do seu container de IPTV
        proxy_pass http://213.199.44.193:8080;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Liberação de CORS para o navegador aceitar os dados
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }
}