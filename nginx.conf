server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy Dinâmico: Aceita qualquer servidor HTTP que vier na URL
    location ~ ^/api/(?<subdomain>[^/]+)/(?<rest>.*)$ {
        # Adiciona os cabeçalhos de CORS para o navegador aceitar
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Encaminha a requisição dinamicamente para o servidor correto em HTTP puro
        proxy_pass http://$subdomain/$rest$is_args$args;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $subdomain;
        proxy_cache_bypass $http_upgrade;
    }
}